name: Build downloadable Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: navidrome-ai-playlist:latest
          provenance: false

      - name: Export compressed Docker image
        run: docker save navidrome-ai-playlist:latest | gzip -9 > navidrome-ai-playlist-amd64.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-ai-playlist-amd64
          path: navidrome-ai-playlist-amd64.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag navidrome-ai-playlist:latest "${DOCKERHUB_USERNAME}/navidrome-ai-playlist:latest"
          docker push "${DOCKERHUB_USERNAME}/navidrome-ai-playlist:latest"

      - name: Report missing Docker Hub credentials
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: echo "Docker Hub push skipped; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
